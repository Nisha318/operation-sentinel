name: deploy

on:
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - "src/**"
      - "policies/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.11.4"
  CONFTEST_IMAGE: "openpolicyagent/conftest:v0.56.0@sha256:9204b38318a7b4be4e49403d81a6c53ed81a99d0c3dd770a216a65edb9a412c7"
  AWS_REGION: us-east-1

concurrency:
  group: operation-sentinel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The environment holds the required reviewers. Its name is part of the OIDC subject
    # that the deploy role trusts, so nothing outside this job can assume the role.
    environment: dev
    permissions:
      id-token: write
      contents: read
    # Same inputs as the PR plan in ci.yml. RELEASE_PRINCIPAL_ARNS is a JSON list repository
    # variable. Without it every apply would reset the release list to empty.
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_authorized_actor_arns: '["${{ vars.AWS_DEPLOY_ROLE_ARN }}"]'
      TF_VAR_release_principal_arns: ${{ vars.RELEASE_PRINCIPAL_ARNS || '[]' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt && python -m pytest -q
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan
        working-directory: envs/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=operation-sentinel/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > plan.json
      - name: Policy gate (OPA via conftest)
        run: |
          docker run --rm -v "$PWD:/project" "${CONFTEST_IMAGE}" \
            test envs/dev/plan.json --policy policies --namespace sentinel.terraform
      - name: Apply the exact plan that passed the gate
        working-directory: envs/dev
        run: terraform apply -input=false tfplan
